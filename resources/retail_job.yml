resources:
  jobs:
    retail_pipeline:
      name: retail-mini-pipeline
      tasks:
        - task_key: bronze_ingestion
          spark_python_task:
            python_file: ../notebooks/01_bronze_ingestion.py
          job_cluster_key: retail_cluster

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingestion
          spark_python_task:
            python_file: ../notebooks/02_silver_transform.py
          job_cluster_key: retail_cluster

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_transform
          spark_python_task:
            python_file: ../notebooks/03_gold_aggregation.py
          job_cluster_key: retail_cluster

        - task_key: data_quality
          depends_on:
            - task_key: gold_aggregation
          spark_python_task:
            python_file: ../notebooks/04_data_quality_checks.py
          job_cluster_key: retail_cluster

      job_clusters:
        - job_cluster_key: retail_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
